<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatWave</title>
    <meta name="description" content="A real-time developer chat system with large code sharing (up to 10k lines), group codes, QR sharing, fast media transfers, and calls." />
    <meta property="og:title" content="ChatWave" />
    <meta property="og:description" content="A real-time developer chat system with large code sharing (up to 10k lines), group codes, QR sharing, fast media transfers, and calls." />
    <meta name="theme-color" content="#111b21" />
    <style>
      body {
        margin: 0;
        background-color: #111b21;
        color: #e9edef;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }
    </style>
    <script>
      window.global = window;
      if (typeof window.process === 'undefined') {
        window.process = {
          env: {},
          version: '',
          nextTick: function (fn) { setTimeout(fn, 0); },
          browser: true
        };
      }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
